name: release

# Builds native binaries for all platforms and attaches them to the GitHub release.
# Trigger with a tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm
            rid: macos-aarch64
          - os: macos-15-intel    # x86_64
            rid: macos-x86_64
          - os: ubuntu-latest     # x86_64
            rid: linux-x86_64
          - os: ubuntu-24.04-arm  # arm
            rid: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/set-version.sh "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build native binaries (JVM tests + native tests + binaries)
        run: mvn -B -Pnative package

      - name: Smoke test the binaries
        run: |
          set -e
          VERSION=${GITHUB_REF_NAME#v}
          jregex=jregex/target/jregex-$VERSION
          jbase64=jbase64/target/jbase64-$VERSION
          juuid=juuid/target/juuid-$VERSION
          jtime=jtime/target/jtime-$VERSION
          jperiod=jperiod/target/jperiod-$VERSION
          jjson=jjson/target/jjson-$VERSION
          jyaml=jyaml/target/jyaml-$VERSION
          jxpath=jxpath/target/jxpath-$VERSION
          jllm=jllm/target/jllm-$VERSION
          jsec=jsec/target/jsec-$VERSION

          $jregex --version
          echo 'a 12 b 345 c' | $jregex find '\d+' | grep -qx 12
          echo 'a 12 b 345 c' | $jregex find '\d+' | grep -qx 345
          $jregex match -q '^a+c$' aaac

          $jbase64 --version
          echo 'hello world' | $jbase64 encode | $jbase64 decode | grep -qx 'hello world'

          $juuid --version
          $juuid gen | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          $juuid parse "$($juuid gen -t 7)" | grep -qx 'version: 7'

          $jtime --version
          $jtime parse 1725787000 | grep -qx 'epoch: 1725787000'
          $jtime now --epoch | grep -qE '^[0-9]{10}$'

          $jperiod --version
          $jperiod parse -u m 2h30m | grep -qx 150
          $jperiod add -u h 2h30m 45m | grep -qx 3.25

          $jjson --version
          $jjson validate '{"a":1}'
          $jjson get a.b[1] '{"a":{"b":[10,20]}}' | grep -qx 20

          $jyaml --version
          $jyaml tojson 'a: 1' | grep -qx '{"a":1}'

          $jxpath --version
          $jxpath select count\(//b\) '<a><b/><b/></a>' | grep -qx 2
          $jxpath exists -q '//b' '<a><b/></a>'

          $jllm --version
          if $jllm request 'hi' >/dev/null 2>&1; then echo "jllm should fail without config"; exit 1; fi

          $jsec --version
          $jsec hash x | grep -qx 2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881
          JSEC_KEY=$($jsec create secret -s 256)
          echo hi | $jsec encrypt --key "$JSEC_KEY" | $jsec decrypt --key "$JSEC_KEY" | grep -qx hi

          echo "smoke tests OK"

      - name: Package artifacts
        run: |
          # one tar.gz per tool, binary inside a 'bin' folder
          for TOOL in jregex jbase64 juuid jtime jperiod jjson jyaml jxpath jllm jsec; do
            mkdir -p dist/$TOOL
            cp $TOOL/target/$TOOL-$VERSION dist/$TOOL/$TOOL
            tar -czf $TOOL-$VERSION-${{ matrix.rid }}.tar.gz -C dist $TOOL
            shasum -a 256 $TOOL-$VERSION-${{ matrix.rid }}.tar.gz > $TOOL-$VERSION-${{ matrix.rid }}.tar.gz.sha256
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            *.tar.gz
            *.sha256

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.sha256
